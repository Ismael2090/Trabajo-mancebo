
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Tech Students</title>
    <link rel="stylesheet" href="styles.css">

    <style>
       
.galeria {
    padding: 120px 8% 50px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.galeria h1 {
    display: block;
    width: 100%;
    font-size: 36px;
    margin-bottom: 35px;
    color: #e88916;
    text-align: center;
}

.fotos {
    display: grid;
    width: 100%;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
}

.fotos img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    border-radius: 12px;
    transition: transform 0.3s;
}

.fotos img:hover {
    transform: scale(1.04);
}

.volver {
    display: inline-block;
    margin-top: 35px;
    padding: 12px 25px;
    background: #e88916;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

@media (max-width: 700px) {
    .fotos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 450px) {
    .fotos {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

<body>

    <main class="galeria">
        <h1>Nuestra galeria</h1>
    

        <div class="fotos">
            <img src="imagenes/curso.jpeg" alt="Proyecto 1">
            <img src="imagenes/curso1.jpeg" alt="Proyecto 2">
            <img src="imagenes/curso2.jpeg" alt="Proyecto 3">
            <img src="imagenes/curso3.jpeg" alt="Proyecto 4">
            <img src="imagenes/curso4.jpeg" alt="Proyecto 5">
            <img src="imagenes/curso5.jpeg" alt="Proyecto 6">
             <img src="imagenes/curso6.jpeg" alt="Proyecto 1">
            <img src="imagenes/curso7.jpeg" alt="Proyecto 2">
            <img src="imagenes/curso8.jpeg" alt="Proyecto 3">
            <img src="imagenes/curso9.jpeg" alt="Proyecto 4">
            <img src="imagenes/curso10.jpeg" alt="Proyecto 5">
            <img src="imagenes/curso11.jpeg" alt="Proyecto 6">
              <img src="imagenes/cursoa.jpeg" alt="Proyecto 1">
            <img src="imagenes/cursob.jpeg" alt="Proyecto 2">
            <img src="imagenes/cursoc.jpeg" alt="Proyecto 3">
            <img src="imagenes/cursod.jpeg" alt="Proyecto 4">
