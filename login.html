```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | Tech Students</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <h1>Tech Students</h1>
                <p>Innovación que transforma ideas</p>
            </div>

            <h2>Iniciar Sesión</h2>

            <form action="index.html">

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Escribe tu usuario"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Escribe tu contraseña"
                        required
                    >
                </div>

                <button type="submit">
                    Iniciar Sesión
                </button>

            </form>

        </div>

    </div>

</body>

</html>
```
