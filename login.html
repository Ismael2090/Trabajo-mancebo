
<!DOCTYPE html>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">

                <p>Innovación que transforma ideas</p>
            </div>

            <h2>Iniciar Sesión</h2>

            <form action="php/procesar_login.php" method="POST">

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Escribe tu usuario"

                    >

                <div class="campo">
                    <label for="password">Contraseña</label>

                        id="password"

                    >
                </div>

                <button type="submit">
                    Iniciar Sesión
                    
                </button>
<p style="text-align: center; margin-top: 18px; font-size: 13px; color: #555;">

        </div>
